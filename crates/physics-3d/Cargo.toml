[package]
name = "ecs-physics-3d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic three-dimensional AABB physics and scenarios for ECS Lab"

[features]
rebuild-reference = []

[[example]]
name = "persistent-benchmark"
required-features = ["rebuild-reference"]

[dependencies]
ecs-physics = { path = "../physics" }
ecs-reference = { path = "../reference" }
ecs-workload = { path = "../workload" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3f65da78e6a7abe3de9f82069b1f3a42a654e3d6" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "46d4eed291762815becde11f79c97019857533d9" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3f65da78e6a7abe3de9f82069b1f3a42a654e3d6" }

[dev-dependencies]
ecs-sparse-set = { path = "../sparse-set" }

[lints]
workspace = true
