name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment fingerprint
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: environment-verify
          install-mode: none

      - name: Check repository conformance
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: conformance
          install-mode: none

      - name: Check deterministic findings
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: findings
          install-mode: none

      - name: Run fast validation tier
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          tier: fast
          install-mode: none

      - name: Exercise benchmark fixtures
        run: bash scripts/benchmark.sh smoke

  build-pages:
    name: Build or reuse validated Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: ecs-lab-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7
