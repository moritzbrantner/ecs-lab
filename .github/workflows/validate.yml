name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run fast validation tier
        uses: moritzbrantner/coding-tooling@a630598d369ac94d0f549dce5c859b9dd28b250c
        with:
          operation: run
          tier: fast
          install-mode: none

      - name: Detect structural validation changes
        id: structure
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              .coding-tooling.json|.coding-tooling.expectations.json|.coding-tooling.dependencies.json|.coding-tooling.source-deps.json|.repository-environment.toml|AGENTS.md|renovate.json|package.json|bun.lock|package-lock.json|pnpm-lock.yaml|yarn.lock|rust-toolchain.toml|Cargo.toml|Cargo.lock|Dockerfile*|docker-compose*.yml|compose*.yml|tsconfig*.json|scripts/codex-environment.sh|.github/dependabot.yml|.github/workflows/*|.github/actions/*|.conventions/*|.devcontainer/*|*/Cargo.toml|*/Cargo.lock|*/package.json|*/tsconfig*.json)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check repository conformance
        if: steps.structure.outputs.changed == 'true'
        uses: moritzbrantner/coding-tooling@a630598d369ac94d0f549dce5c859b9dd28b250c
        with:
          operation: conformance
          install-mode: none

      - name: Check deterministic findings
        if: steps.structure.outputs.changed == 'true'
        uses: moritzbrantner/coding-tooling@a630598d369ac94d0f549dce5c859b9dd28b250c
        with:
          operation: findings
          install-mode: none

      - name: Enforce deterministic storage ratchets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/storage-ratchet.sh

      - name: Exercise benchmark fixtures
        run: bash scripts/benchmark.sh smoke

  build-pages:
    name: Build or reuse validated Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@8669e7cad2233c0fb1e0fcc3e00a041d2b6d7b03
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: ecs-lab-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7
