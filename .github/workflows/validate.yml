name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 20afb614772346991b3e7ac60b5857ecab5472e3
          path: .ci/coding-tooling
          persist-credentials: false

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 112e910ed735b8fd52301e62c82d76543e4176b0
          path: .ci/coding-agent-conventions
          persist-credentials: false

      - name: Reconcile pinned convention snapshot
        env:
          CODING_AGENT_CONVENTIONS_ROOT: ${{ github.workspace }}/.ci/coding-agent-conventions
        run: |
          cat > conventions.json <<'JSON'
          {
            "schemaVersion": 1,
            "registry": "coding-agent-conventions",
            "modules": ["rust", "environment", "git"]
          }
          JSON
          bun .ci/coding-tooling/src/cli.ts conventions update --json

      - name: Commit reconciled convention snapshot
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -rf .ci
          git add conventions.json conventions.lock.json .conventions
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: defer benchmarking convention until benchmarks exist"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Remove convention source checkouts
        if: always()
        run: rm -rf .ci

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment fingerprint
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: environment-verify
          install-mode: none

      - name: Check repository conformance
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: conformance
          install-mode: none

      - name: Check deterministic findings
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          operation: findings
          install-mode: none

      - name: Run fast validation tier
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          tier: fast
          install-mode: none
