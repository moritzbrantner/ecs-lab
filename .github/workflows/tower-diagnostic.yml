name: Tower diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  tower-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup
      - name: Capture first tower failure
        shell: bash
        run: |
          set +e
          cargo test -p ecs-web-demo tower_fixture_never_finishes_below_floor_surface -- --nocapture 2>&1 | tee tower-diagnostic.log
          printf 'exit=%s\n' "${PIPESTATUS[0]}" >> tower-diagnostic.log
          exit 0
      - name: Upload tower diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tower-diagnostic-${{ github.event.pull_request.head.sha }}
          path: tower-diagnostic.log
          if-no-files-found: error
