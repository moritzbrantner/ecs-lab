name: Temporary format sphere OBB response

on:
  push:
    branches: [physics/sphere-obb-response]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: physics/sphere-obb-response
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.98.0 --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/physics-3d/src/sphere_obb_response.rs crates/physics-3d/src/lib.rs
          git commit -m "Format sphere-OBB response"
          git push origin HEAD:physics/sphere-obb-response
