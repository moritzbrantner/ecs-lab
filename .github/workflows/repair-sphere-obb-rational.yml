name: Repair sphere OBB rational contact

on:
  push:
    branches: [physics/sphere-obb-response]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: physics/sphere-obb-response
          fetch-depth: 0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Align temporary repair driver with exact source
        run: python3 .github/scripts/prepare_sphere_obb_repair.py

      - name: Apply exact rational contact repair
        run: python3 .github/scripts/repair_sphere_obb_rational.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Run focused sphere OBB response tests
        run: cargo test -p ecs-physics-3d sphere_obb_response::tests

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Commit repair and remove temporary execution files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-sphere-obb-rational.yml
          git rm -f .github/scripts/repair_sphere_obb_rational.py
          git rm .github/scripts/prepare_sphere_obb_repair.py
          git add crates/physics-3d/src/sphere_obb_response.rs
          git diff --cached --check
          git commit -m "Preserve rational sphere-OBB contact response"
          git push origin HEAD:physics/sphere-obb-response
